<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CellMate — Create Account</title>
<meta name="description" content="Create a CellMate account to access express repair bookings, instant warranty verification, and exclusive mobile accessory offers.">

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<!-- Bootstrap 5.3 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- Tailwind (utility helpers only) -->
<script src="https://cdn.tailwindcss.com"></script>
<script> tailwind.config = { corePlugins: { preflight: false } }; </script>

<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<!-- Favicon -->
<link rel="icon" type="image/png" href="Asset/logo.png">

<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- GRAIN OVERLAY -->
<div class="grain-overlay" aria-hidden="true"></div>

<!-- FULLSCREEN AUTH CONTAINER (NO NAVBAR, NO FOOTER) -->
<main class="cm-auth-page">
  <div class="cm-auth-bg" aria-hidden="true"></div>

  <!-- Top Right Utility Actions (Theme & RTL Toggle) -->
  <div class="cm-auth-top-actions">
    <button class="cm-rtl-toggle" id="rtlToggle" aria-label="Toggle RTL mode" title="Toggle RTL / LTR mode">RTL</button>
    <button class="cm-theme-btn" id="themeBtn" aria-label="Switch between light and dark mode">
      <i class="bi bi-sun-fill"></i>
      <i class="bi bi-moon-stars-fill"></i>
    </button>
  </div>

  <div class="cm-auth-container">
    <div class="cm-auth-card">
      
      <!-- Logo & Header -->
      <div class="cm-auth-header">
        <a href="index.html" class="cm-auth-logo">
          <img src="Asset/logo.png" alt="CellMate Logo" class="cm-logo__img">
          <span class="cm-logo__text">Cell<span>Mate</span></span>
        </a>
        <h1 class="cm-auth-title">Create Account</h1>
        <p class="cm-auth-desc">Join CellMate for priority repair scheduling &amp; warranty tracking.</p>
      </div>

      <!-- Sign Up Form -->
      <form id="signupForm" onsubmit="event.preventDefault(); alert('Account created successfully! Welcome to CellMate.'); window.location.href='login.html';">
        <div class="cm-form__row mb-3">
          <label for="signupName">Full Name *</label>
          <input type="text" id="signupName" placeholder="Alex Morgan" required>
        </div>

        <div class="cm-form__row mb-3">
          <label for="signupEmail">Email Address *</label>
          <input type="email" id="signupEmail" placeholder="name@example.com" required>
        </div>

        <div class="cm-form__row mb-3">
          <label for="signupPhone">Phone Number *</label>
          <input type="tel" id="signupPhone" placeholder="+1 (555) 019-2834" required>
        </div>

        <div class="cm-form__row mb-3">
          <label for="signupPassword">Password *</label>
          <!-- Password Group with Eye Effect -->
          <div class="cm-input-group">
            <input type="password" id="signupPassword" placeholder="Minimum 8 characters" minlength="8" required>
            <button type="button" class="cm-password-toggle" data-target="signupPassword" aria-label="Toggle password visibility">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>

        <div class="cm-form__row mb-3">
          <label for="signupConfirmPassword">Confirm Password *</label>
          <!-- Password Group with Eye Effect -->
          <div class="cm-input-group">
            <input type="password" id="signupConfirmPassword" placeholder="Re-enter password" minlength="8" required>
            <button type="button" class="cm-password-toggle" data-target="signupConfirmPassword" aria-label="Toggle password visibility">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>

        <div class="d-flex align-items-center mb-4">
          <label class="cm-auth-checkbox">
            <input type="checkbox" required>
            <span>I agree to CellMate's <a href="#" class="cm-auth-link">Terms</a> &amp; <a href="#" class="cm-auth-link">Privacy Policy</a></span>
          </label>
        </div>

        <button type="submit" class="cm-btn cm-btn--primary w-100 justify-content-center cm-btn--lg mb-4">
          <span>Create Account</span>
          <i class="bi bi-arrow-right"></i>
        </button>
      </form>

      <!-- Symmetric Centered Divider -->
      <div class="cm-auth-divider mb-4">
        <span>or register with social</span>
      </div>

      <!-- Third Party Access (Official 4-Color Google Logo & Apple Logo AFTER Submit Button) -->
      <div class="cm-social-auth mb-4">
        <button type="button" class="cm-social-btn cm-social-btn--google">
          <svg class="cm-google-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
          </svg>
          <span>Google</span>
        </button>
        <button type="button" class="cm-social-btn cm-social-btn--apple">
          <i class="bi bi-apple"></i>
          <span>Apple</span>
        </button>
      </div>

      <!-- Foot Link -->
      <div class="cm-auth-foot">
        Already have an account? <a href="login.html" class="cm-auth-link">Sign In</a>
      </div>

    </div>
  </div>
</main>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
