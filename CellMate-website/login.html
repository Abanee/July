<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CellMate — Account Login</title>
<meta name="description" content="Log in to your CellMate account to track repair tickets, view diagnostic history, and manage your device service requests.">

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<!-- Bootstrap 5.3 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- Tailwind (utility helpers only) -->
<script src="https://cdn.tailwindcss.com"></script>
<script> tailwind.config = { corePlugins: { preflight: false } }; </script>

<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- GRAIN OVERLAY -->
<div class="grain-overlay" aria-hidden="true"></div>

<!-- FULLSCREEN AUTH CONTAINER (NO NAVBAR, NO FOOTER) -->
<main class="cm-auth-page">
  <div class="cm-auth-bg" aria-hidden="true"></div>

  <!-- Top Right Utility Actions (Theme & RTL Toggle) -->
  <div style="position: absolute; top: 24px; right: 24px; z-index: 10; display: flex; align-items: center; gap: 10px;">
    <button class="cm-rtl-toggle" id="rtlToggle" aria-label="Toggle RTL mode" title="Toggle RTL / LTR mode">RTL</button>
    <button class="cm-theme-btn" id="themeBtn" aria-label="Switch between light and dark mode">
      <i class="bi bi-sun-fill"></i>
      <i class="bi bi-moon-stars-fill"></i>
    </button>
  </div>

  <div class="cm-auth-container">
    <div class="cm-auth-card">
      
      <!-- Logo & Header -->
      <div class="cm-auth-header">
        <a href="index.html" class="cm-auth-logo">
          <span class="cm-logo__mark"><i class="bi bi-cpu-fill"></i></span>
          <span class="cm-logo__text">Cell<span>Mate</span></span>
        </a>
        <h1 class="cm-auth-title">Welcome Back</h1>
        <p class="cm-auth-desc">Sign in to track your repair tickets and manage device diagnostics.</p>
      </div>

      <!-- Third Party Access (Google & Apple) -->
      <div class="cm-social-auth">
        <button type="button" class="cm-social-btn cm-social-btn--google">
          <i class="bi bi-google"></i>
          <span>Google</span>
        </button>
        <button type="button" class="cm-social-btn cm-social-btn--apple">
          <i class="bi bi-apple"></i>
          <span>Apple</span>
        </button>
      </div>

      <div class="cm-auth-divider">
        <span>or sign in with email</span>
      </div>

      <!-- Login Form -->
      <form id="loginForm" onsubmit="event.preventDefault(); alert('Login successful! Redirecting to dashboard...'); window.location.href='index.html';">
        <div class="cm-form__row mb-3">
          <label for="loginEmail">Email Address</label>
          <input type="email" id="loginEmail" placeholder="name@example.com" required>
        </div>

        <div class="cm-form__row mb-3">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <label for="loginPassword" class="mb-0">Password</label>
            <a href="#" onclick="alert('Password reset link has been sent to your email.'); return false;" class="text-xs text-blue-500 hover:underline">Forgot Password?</a>
          </div>
          <!-- Password Group with Eye Effect -->
          <div class="cm-input-group">
            <input type="password" id="loginPassword" placeholder="••••••••" required>
            <button type="button" class="cm-password-toggle" data-target="loginPassword" aria-label="Toggle password visibility">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>

        <div class="d-flex align-items-center justify-content-between mb-4">
          <label class="d-flex align-items-center gap-2 cursor-pointer mb-0 text-sm text-slate-400">
            <input type="checkbox" checked class="accent-blue-600 rounded">
            <span>Remember this device</span>
          </label>
        </div>

        <button type="submit" class="cm-btn cm-btn--primary w-100 justify-content-center">
          <span>Sign In to Account</span>
          <i class="bi bi-arrow-right"></i>
        </button>
      </form>

      <!-- Foot Link -->
      <div class="cm-auth-foot">
        Don't have an account? <a href="signup.html">Create Account</a>
      </div>

    </div>
  </div>
</main>

<script src="script.js"></script>
</body>
</html>
