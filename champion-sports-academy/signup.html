<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account — Champion Sports Academy</title>
<meta name="description" content="Create your Champion Sports Academy student account to book trials, track progress, and connect with your coaches.">
<link rel="icon" type="image/png" href="Assets/logo.png">

<!-- Theme init — before paint -->
<script>
  (function(){
    var t = localStorage.getItem('csa-theme');
    document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
    var isRTL = localStorage.getItem('csa-rtl') === 'true';
    if (isRTL) document.documentElement.setAttribute('dir', 'rtl');
  })();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="auth.css">
</head>
<body>

<!-- Floating Top Controls (RTL + Theme) -->
<div class="auth-top-controls">
  <button id="rtl-toggle" class="auth-control-btn" aria-label="Toggle right-to-left layout" aria-pressed="false" title="Toggle RTL">RTL</button>
  <button id="theme-toggle" class="auth-control-btn" aria-label="Toggle colour theme" type="button">
    <svg id="icon-moon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
    <svg id="icon-sun"  width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="hidden"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
</div>

<!-- Centered Auth Page -->
<div class="auth-page">
  <div class="auth-center-card">

    <!-- Academy Logo + Header (Clickable -> redirect to home) -->
    <div class="auth-brand-header">
      <a href="index.html" class="auth-logo-link" title="Champion Sports Academy Home">
        <img src="Assets/logo.png" alt="Champion Sports Academy" class="w-9 h-9 object-contain">
        <div class="auth-logo-text">
          <span class="brand-name">CHAMPION</span>
          <span class="brand-sub">SPORTS ACADEMY</span>
        </div>
      </a>
      <h1 class="auth-form-title">Create your account</h1>
      <p class="auth-form-subtitle">Join the academy — it's free to sign up.</p>
    </div>

    <!-- Sign up form -->
    <form class="auth-form" id="signup-form" novalidate style="margin-top: 24px;">

      <!-- Name row -->
      <div class="af-row-2">
        <div class="af-group">
          <label class="af-label" for="su-fname">First Name</label>
          <div class="af-input-wrap">
            <span class="af-input-icon">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </span>
            <input type="text" id="su-fname" name="fname" class="af-input" placeholder="First name" autocomplete="given-name" required aria-required="true">
          </div>
          <span class="af-error" id="su-fname-err" role="alert" aria-live="polite"></span>
        </div>
        <div class="af-group">
          <label class="af-label" for="su-lname">Last Name</label>
          <div class="af-input-wrap">
            <span class="af-input-icon">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </span>
            <input type="text" id="su-lname" name="lname" class="af-input" placeholder="Last name" autocomplete="family-name" required aria-required="true">
          </div>
          <span class="af-error" id="su-lname-err" role="alert" aria-live="polite"></span>
        </div>
      </div>

      <!-- Email -->
      <div class="af-group">
        <label class="af-label" for="su-email">Email Address</label>
        <div class="af-input-wrap">
          <span class="af-input-icon">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          </span>
          <input type="email" id="su-email" name="email" class="af-input" placeholder="your@email.com" autocomplete="email" required aria-required="true">
        </div>
        <span class="af-error" id="su-email-err" role="alert" aria-live="polite"></span>
      </div>

      <!-- Phone (optional) -->
      <div class="af-group">
        <label class="af-label" for="su-phone">Phone Number <span style="font-weight:400;color:var(--text-muted)">(optional)</span></label>
        <div class="af-input-wrap">
          <span class="af-input-icon">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.9v3a2 2 0 0 1-2.2 2A19.8 19.8 0 0 1 3.1 4.2 2 2 0 0 1 5.1 2h3a2 2 0 0 1 2 1.7 12.8 12.8 0 0 0 .7 2.8 2 2 0 0 1-.5 2.1L9.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4 12.8 12.8 0 0 0 2.8.7A2 2 0 0 1 23 16.9z"/></svg>
          </span>
          <input type="tel" id="su-phone" name="phone" class="af-input" placeholder="+91 00000 00000" autocomplete="tel">
        </div>
      </div>

      <!-- Password -->
      <div class="af-group">
        <label class="af-label" for="su-password">Password</label>
        <div class="af-input-wrap">
          <span class="af-input-icon">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          </span>
          <input type="password" id="su-password" name="password" class="af-input" placeholder="Create a password" autocomplete="new-password" required aria-required="true">
          <button type="button" class="af-eye-btn" id="su-eye" aria-label="Show/hide password">
            <svg id="su-eye-off" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            <svg id="su-eye-on" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <!-- Strength meter -->
        <div class="af-strength">
          <div class="af-strength-bar"><div class="af-strength-fill s0" id="su-strength-fill"></div></div>
          <span class="af-strength-label" id="su-strength-label">Enter a password</span>
        </div>
        <span class="af-error" id="su-pw-err" role="alert" aria-live="polite"></span>
      </div>

      <!-- Confirm Password -->
      <div class="af-group">
        <label class="af-label" for="su-confirm">Confirm Password</label>
        <div class="af-input-wrap">
          <span class="af-input-icon">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          </span>
          <input type="password" id="su-confirm" name="confirm" class="af-input" placeholder="Repeat your password" autocomplete="new-password" required aria-required="true">
          <button type="button" class="af-eye-btn" id="su-eye2" aria-label="Show/hide password">
            <svg id="su-eye2-off" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            <svg id="su-eye2-on" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <span class="af-error" id="su-confirm-err" role="alert" aria-live="polite"></span>
      </div>

      <!-- Terms consent -->
      <div class="af-consent-row">
        <label class="af-checkbox-label" for="su-terms" style="align-items:flex-start">
          <input type="checkbox" id="su-terms" name="terms" required aria-required="true">
          <span class="af-custom-check" style="margin-top:2px">
            <svg class="af-custom-check-icon" width="10" height="8" viewBox="0 0 10 8" fill="none"><polyline points="1 4 4 7 9 1" stroke="#061A2E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          <span class="af-consent-label">I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a> of Champion Sports Academy.</span>
        </label>
      </div>
      <span class="af-error" id="su-terms-err" role="alert" aria-live="polite"></span>

      <!-- Submit -->
      <button type="submit" class="af-submit" id="su-submit">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
        Create Account
      </button>

    </form>

    <!-- Divider -->
    <div class="auth-divider"><span>or sign up with</span></div>

    <!-- Social buttons -->
    <div class="auth-socials" style="margin-top: 0; margin-bottom: 20px;">
      <!-- Google -->
      <button class="auth-social-btn auth-btn-google" type="button" id="btn-google" aria-label="Continue with Google">
        <span class="social-logo">
          <!-- Official Google G logo -->
          <svg width="20" height="20" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
          </svg>
        </span>
        Continue with Google
      </button>

      <!-- Apple -->
      <button class="auth-social-btn auth-btn-apple" type="button" id="btn-apple" aria-label="Continue with Apple">
        <span class="social-logo">
          <!-- Official Apple Logo (Sharp Vector) -->
          <svg width="19" height="19" viewBox="0 0 170 170" fill="currentColor">
            <path d="M150.37 130.25c-2.45 5.66-5.35 10.87-8.71 15.66-4.58 6.53-8.33 11.05-11.22 13.56-4.48 4.12-9.28 6.23-14.42 6.35-3.69 0-8.14-1.05-13.32-3.18-5.19-2.12-9.97-3.17-14.34-3.17-4.58 0-9.49 1.05-14.75 3.17-5.26 2.13-9.5 3.24-12.74 3.35-4.35.13-9.16-1.9-14.42-6.08-3.7-3.08-7.7-7.85-12.01-14.3-6.09-9.14-10.87-19.74-14.34-31.79-3.48-12.05-5.22-23.47-5.22-34.27 0-14.24 3.7-25.9 11.09-34.98 7.39-9.08 16.63-13.73 27.72-13.96 4.9.11 10.11 1.35 15.63 3.73 5.52 2.38 9.24 3.65 11.16 3.8 2.06-.27 5.86-1.57 11.41-3.9 5.55-2.33 10.63-3.41 15.24-3.26 13.6.87 24.36 5.86 32.27 14.97-11.95 7.27-17.79 17.29-17.53 30.07.26 10 4.09 18.39 11.48 25.16 4.35 4.02 9.38 6.94 15.08 8.78-2.45 7.28-5.59 14.86-9.42 22.75zm-30.82-108.61c0 6.62-2.43 12.83-7.29 18.63-5.74 6.84-12.85 10.74-21.32 11.71-.22-1.3-.33-2.61-.33-3.91 0-6.63 2.65-13.15 7.95-19.57 2.65-3.26 5.92-5.92 9.8-7.99 3.87-2.06 7.64-3.2 11.3-3.43.08 1.52.12 3.04.12 4.56z"/>
          </svg>
        </span>
        Continue with Apple
      </button>
    </div>

    <p class="auth-switch">Already have an account? <a href="signin.html">Sign in</a></p>

  </div>
</div>

<script>
  /* ── RTL Toggle ── */
  const rtlBtn = document.getElementById('rtl-toggle');
  function toggleRTL() {
    const isRTL = document.documentElement.getAttribute('dir') !== 'rtl';
    document.documentElement.setAttribute('dir', isRTL ? 'rtl' : 'ltr');
    localStorage.setItem('csa-rtl', String(isRTL));
    if (rtlBtn) rtlBtn.setAttribute('aria-pressed', String(isRTL));
  }
  if (rtlBtn) {
    rtlBtn.setAttribute('aria-pressed', String(document.documentElement.getAttribute('dir') === 'rtl'));
    rtlBtn.addEventListener('click', toggleRTL);
  }

  /* ── Theme toggle ── */
  const themeBtn = document.getElementById('theme-toggle');
  const moonIcon = document.getElementById('icon-moon');
  const sunIcon  = document.getElementById('icon-sun');
  function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    localStorage.setItem('csa-theme', t);
    moonIcon && moonIcon.classList.toggle('hidden', t === 'light');
    sunIcon  && sunIcon.classList.toggle('hidden',  t === 'dark');
  }
  applyTheme(document.documentElement.getAttribute('data-theme') || 'dark');
  themeBtn && themeBtn.addEventListener('click', () => {
    const cur = document.documentElement.getAttribute('data-theme');
    applyTheme(cur === 'dark' ? 'light' : 'dark');
  });

  /* ── Social stubs ── */
  const gBtn = document.getElementById('btn-google');
  const aBtn = document.getElementById('btn-apple');
  gBtn && gBtn.addEventListener('click', () => alert('Google Sign-Up: connected successfully.'));
  aBtn && aBtn.addEventListener('click', () => alert('Apple Sign-Up: connected successfully.'));

  /* ── Show/hide password ── */
  function togglePw(inputId, eyeOffId, eyeOnId) {
    const inp = document.getElementById(inputId);
    const off = document.getElementById(eyeOffId);
    const on  = document.getElementById(eyeOnId);
    if (!inp || !off || !on) return;
    const show = inp.type === 'password';
    inp.type = show ? 'text' : 'password';
    off.style.display = show ? 'none' : '';
    on.style.display  = show ? ''     : 'none';
  }
  document.getElementById('su-eye').addEventListener('click', () => togglePw('su-password','su-eye-off','su-eye-on'));
  document.getElementById('su-eye2').addEventListener('click', () => togglePw('su-confirm','su-eye2-off','su-eye2-on'));

  /* ── Password strength ── */
  const pwInput   = document.getElementById('su-password');
  const fill      = document.getElementById('su-strength-fill');
  const label     = document.getElementById('su-strength-label');
  const levels = ['','Very weak','Weak','Good','Strong'];
  const colours= ['s0','s1','s2','s3','s4'];

  function scorePassword(p) {
    if (!p) return 0;
    let s = 0;
    if (p.length >= 6)  s++;
    if (p.length >= 10) s++;
    if (/[A-Z]/.test(p) && /[0-9]/.test(p)) s++;
    if (/[^A-Za-z0-9]/.test(p)) s++;
    return s;
  }

  pwInput.addEventListener('input', () => {
    const s = scorePassword(pwInput.value);
    fill.className = 'af-strength-fill ' + (colours[s] || 's0');
    label.textContent = levels[s] || 'Enter a password';
  });

  /* ── Form validation + submit ── */
  const form     = document.getElementById('signup-form');
  const fnameEl  = document.getElementById('su-fname');
  const lnameEl  = document.getElementById('su-lname');
  const emailEl  = document.getElementById('su-email');
  const confEl   = document.getElementById('su-confirm');
  const termsEl  = document.getElementById('su-terms');

  const fnameErr = document.getElementById('su-fname-err');
  const lnameErr = document.getElementById('su-lname-err');
  const emailErr = document.getElementById('su-email-err');
  const pwErr    = document.getElementById('su-pw-err');
  const confErr  = document.getElementById('su-confirm-err');
  const termsErr = document.getElementById('su-terms-err');

  function validate() {
    let ok = true;

    if (!fnameEl.value.trim()) {
      fnameErr.textContent = 'First name is required.';
      fnameEl.classList.add('has-error'); ok = false;
    } else { fnameErr.textContent = ''; fnameEl.classList.remove('has-error'); }

    if (!lnameEl.value.trim()) {
      lnameErr.textContent = 'Last name is required.';
      lnameEl.classList.add('has-error'); ok = false;
    } else { lnameErr.textContent = ''; lnameEl.classList.remove('has-error'); }

    if (!emailEl.value || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailEl.value)) {
      emailErr.textContent = 'Please enter a valid email address.';
      emailEl.classList.add('has-error'); ok = false;
    } else { emailErr.textContent = ''; emailEl.classList.remove('has-error'); }

    if (!pwInput.value || pwInput.value.length < 6) {
      pwErr.textContent = 'Password must be at least 6 characters.';
      pwInput.classList.add('has-error'); ok = false;
    } else { pwErr.textContent = ''; pwInput.classList.remove('has-error'); }

    if (confEl.value !== pwInput.value) {
      confErr.textContent = 'Passwords do not match.';
      confEl.classList.add('has-error'); ok = false;
    } else { confErr.textContent = ''; confEl.classList.remove('has-error'); }

    if (!termsEl.checked) {
      termsErr.textContent = 'You must agree to the Terms of Service.';
      ok = false;
    } else { termsErr.textContent = ''; }

    return ok;
  }

  form.addEventListener('submit', e => {
    e.preventDefault();
    if (validate()) {
      window.location.href = 'dashboard.html';
    }
  });
</script>
</body>
</html>
